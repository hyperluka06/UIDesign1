<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COPO : Shared Posters</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="shared-posters.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div class="badge-wrapper">
        <span class="page-badge">Shared Posters</span>
        <div class="countdown-timer" id="countdown-timer">refreshed in 0d 00h 00m 00s</div>
    </div>

    <div class="shared-layout">
        
        <div class="shared-container">
            <main class="shared-main">
                <h1 class="main-heading">This week’s keywords are...</h1>

                <div class="keyword-grid">
                    <div class="keyword-btn">main colors be red and black</div>
                    <div class="keyword-btn">use grainy textures</div>
                    <div class="keyword-btn">express ‘energy’</div>
                    <div class="keyword-btn">add a big circle</div>
                </div>

                <div class="upload-section">
                    <a href="#" class="upload-link" id="upload-trigger">upload mine ➔</a>
                    <input type="file" id="poster-file-input" accept="image/*" style="display: none;">
                    <input type="file" id="replace-file-input" accept="image/*" style="display: none;">
                </div>

                <section class="poster-feed" id="poster-feed-container">
                    <div class="poster-item dummy-black"></div>
                    <div class="poster-item dummy-black"></div>
                    <div class="poster-item dummy-black"></div>
                    <div class="poster-item dummy-black"></div>
                    <div class="poster-item dummy-black"></div>
                </section>
            </main>
        </div>

        <aside class="keyring-sidebar" id="three-canvas-container"></aside>

    </div>

    <div class="poster-modal" id="poster-modal">
        <button class="modal-close-btn" id="modal-close-btn">&times;</button>
        <div class="modal-content">
            <img id="modal-image" src="" alt="Zoomed Poster">
            <div class="modal-action-group">
                <button class="action-btn replace-btn" id="replace-btn">Replace Image</button>
                <button class="action-btn delete-btn" id="delete-btn">Delete Poster</button>
            </div>
        </div>
    </div>

    <script>
        /* ==========================================================================
           기존 Shared Posters UI 스크립트
           ========================================================================== */
        const uploadTrigger = document.getElementById('upload-trigger');
        const fileInput = document.getElementById('poster-file-input');
        const replaceFileInput = document.getElementById('replace-file-input');
        const feedContainer = document.getElementById('poster-feed-container');
        
        const posterModal = document.getElementById('poster-modal');
        const modalImage = document.getElementById('modal-image');
        const modalCloseBtn = document.getElementById('modal-close-btn');
        const timerElement = document.getElementById('countdown-timer');

        const replaceBtn = document.getElementById('replace-btn');
        const deleteBtn = document.getElementById('delete-btn');

        let currentTargetIndex = null;

        function renderFeed() {
            feedContainer.innerHTML = '';
            const savedPosters = JSON.parse(localStorage.getItem('myPosters')) || [];
            
            savedPosters.forEach((imageUrl, index) => {
                const posterItem = document.createElement('div');
                posterItem.className = 'poster-item';
                posterItem.dataset.index = index; 
                
                const img = document.createElement('img');
                img.src = imageUrl;
                img.alt = "My Uploaded Poster";
                
                posterItem.appendChild(img);
                feedContainer.appendChild(posterItem);
            });

            const currentTotalCount = savedPosters.length;
            if (currentTotalCount < 5) {
                for (let i = 0; i < (5 - currentTotalCount); i++) {
                    const dummyItem = document.createElement('div');
                    dummyItem.className = 'poster-item dummy-black';
                    feedContainer.appendChild(dummyItem);
                }
            }
        }

        uploadTrigger.addEventListener('click', (e) => {
            e.preventDefault();
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const imageUrl = event.target.result;
                    const savedPosters = JSON.parse(localStorage.getItem('myPosters')) || [];
                    savedPosters.push(imageUrl);
                    localStorage.setItem('myPosters', JSON.stringify(savedPosters));
                    
                    renderFeed();
                };
                reader.readAsDataURL(file);
            }
            fileInput.value = '';
        });

        feedContainer.addEventListener('click', (e) => {
            const clickedItem = e.target.closest('.poster-item');
            if (clickedItem && !clickedItem.classList.contains('dummy-black') && e.target.tagName === 'IMG') {
                modalImage.src = e.target.src;
                currentTargetIndex = parseInt(clickedItem.dataset.index, 10);
                posterModal.classList.add('active');
                document.body.style.overflow = 'hidden';
            }
        });

        function closeModal() {
            posterModal.classList.remove('active');
            document.body.style.overflow = 'auto';
            currentTargetIndex = null;
        }

        modalCloseBtn.addEventListener('click', closeModal);
        posterModal.addEventListener('click', (e) => {
            if (e.target === posterModal) closeModal();
        });

        replaceBtn.addEventListener('click', () => {
            if (currentTargetIndex !== null) {
                replaceFileInput.click();
            }
        });

        replaceFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file && currentTargetIndex !== null) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const newImageUrl = event.target.result;
                    const savedPosters = JSON.parse(localStorage.getItem('myPosters')) || [];
                    savedPosters[currentTargetIndex] = newImageUrl;
                    localStorage.setItem('myPosters', JSON.stringify(savedPosters));
                    
                    renderFeed();
                    closeModal();
                };
                reader.readAsDataURL(file);
            }
            replaceFileInput.value = '';
        });

        deleteBtn.addEventListener('click', () => {
            if (currentTargetIndex !== null && confirm("Are you sure you want to delete your poster?")) {
                const savedPosters = JSON.parse(localStorage.getItem('myPosters')) || [];
                savedPosters.splice(currentTargetIndex, 1);
                localStorage.setItem('myPosters', JSON.stringify(savedPosters));
                renderFeed();
                closeModal();
            }
        });

        function updateCountdown() {
            const now = new Date();
            const nowUTC = Date.now();
            const dateUTC = new Date(nowUTC);
            const currentUTCDay = dateUTC.getUTCDay(); 
            
            const daysUntilNextMonday = currentUTCDay === 0 ? 1 : 8 - currentUTCDay;
            
            const targetLeftUTC = new Date(Date.UTC(
                dateUTC.getUTCFullYear(),
                dateUTC.getUTCMonth(),
                dateUTC.getUTCDate() + daysUntilNextMonday,
                0, 0, 0
            ));
            
            const diff = targetLeftUTC.getTime() - nowUTC;
            
            if (diff <= 0) {
                timerElement.textContent = "refreshed in 0d 00h 00m 00s";
                return;
            }
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            const formattedHours = String(hours).padStart(2, '0');
            const formattedMinutes = String(minutes).padStart(2, '0');
            const formattedSeconds = String(seconds).padStart(2, '0');
            
            timerElement.textContent = `refreshed in ${days}d ${formattedHours}h ${formattedMinutes}m ${formattedSeconds}s`;
        }

        renderFeed();
        updateCountdown();
        setInterval(updateCountdown, 1000);


        /* ==========================================================================
           3D 키링 인터랙션 엔진 (우측 독립 영역)
           ========================================================================== */
        const FontLoader = THREE.FontLoader;
        const TextGeometry = THREE.TextGeometry;

        const scene = new THREE.Scene();
        const container = document.getElementById('three-canvas-container');

        const CAMERA_FOV = 38;
        const camera = new THREE.PerspectiveCamera(
          CAMERA_FOV, 
          container.clientWidth / container.clientHeight,
          0.1,
          100
        );

        function getResponsiveCameraZ() {
          const width = container.clientWidth;
          if (width < 350) return 22;
          else if (width < 500) return 19;
          else return 16;
        }
        camera.position.set(0, 0, getResponsiveCameraZ()); 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2; 
        container.appendChild(renderer.domElement);

        let ring;
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        let startMousePos = { x: 0, y: 0 };
        let startTouchPos = { x: 0, y: 0 };
        const CLICK_THRESHOLD = 5;

        let clickablePendants = [];

        const targetLinks = [
          "index.html",
          "", 
          "personal-poster.html"
        ];

        const keyLight = new THREE.DirectionalLight("#ffffff", 3);
        keyLight.position.set(5, 8, 5);
        scene.add(keyLight);

        const fillLight = new THREE.PointLight("#ffffff", 2);
        fillLight.position.set(-5, 3, 4);
        scene.add(fillLight);

        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();
        scene.environment = pmremGenerator.fromScene(new THREE.Scene()).texture;

        const chromeMaterial = new THREE.MeshPhysicalMaterial({
          color: "#ffffff",
          metalness: 0.9,
          roughness: 0.12,
          clearcoat: 1,
          clearcoatRoughness: 0.05
        });

        const pinkMaterial = new THREE.MeshStandardMaterial({
          color: "#d34aa0",
          roughness: 0.35,
          metalness: 0.1
        });

        const ringRadius = 2.6;
        const ringGeometry = new THREE.TorusGeometry(ringRadius, 0.09, 24, 100); 
        ring = new THREE.Mesh(ringGeometry, chromeMaterial);
        ring.rotation.set(0.3, -0.6, 0);
        scene.add(ring);

        const chainGeometry = new THREE.TorusGeometry(0.16, 0.05, 12, 32); 
        const segmentsPerChain = 5; 
        const segmentLength = 0.22; 

        let chains = []; 
        const GRAVITY = -0.015;  
        const DAMPING = 0.80;    

        const fontUrls = [ 
          "https://threejs.org/examples/fonts/gentilis_bold.typeface.json",   
          "https://threejs.org/examples/fonts/optimer_bold.typeface.json",
          "https://threejs.org/examples/fonts/helvetiker_bold.typeface.json"     
        ];

        const textConfigs = [
          { text: "Go back to main home", isEllipse: false },
          { text: "Shared Posters", isEllipse: false },
          { text: "Personal Poster", isEllipse: true }
        ];

        const fontLoader = new FontLoader();

        textConfigs.forEach((config, index) => {
          fontLoader.load(fontUrls[index], (font) => {
            const angle = (index / textConfigs.length) * Math.PI * 2;
            const localAttachPoint = new THREE.Vector3(Math.cos(angle) * ringRadius, Math.sin(angle) * ringRadius, 0);

            ring.updateMatrixWorld();
            const worldAttachPoint = localAttachPoint.clone().applyMatrix4(ring.matrixWorld);

            let points = [];
            for (let i = 0; i < segmentsPerChain; i++) {
              const mesh = new THREE.Mesh(chainGeometry, chromeMaterial);
              scene.add(mesh);
              const pos = worldAttachPoint.clone().add(new THREE.Vector3(0, -(i + 1) * segmentLength, 0));
              points.push({ type: 'chain', mesh: mesh, position: pos.clone(), oldPosition: pos.clone(), index: i });
            }

            let pendantGroup = new THREE.Group();
            
            const textGeo = new TextGeometry(config.text, {
              font: font, 
              size: index === 0 ? 0.22 : 0.20,  
              height: 0.06,                     
              curveSegments: 16,
              bevelEnabled: true,
              bevelThickness: 0.015,
              bevelSize: 0.008,
              bevelSegments: 4
            });
            textGeo.center(); 

            let currentPendantLength = 0.4;

            if (config.isEllipse) {
              const ellipseGeo = new THREE.CircleGeometry(0.8, 64);
              ellipseGeo.scale(1.4, 0.7, 1.0); 
              const ellipseMesh = new THREE.Mesh(ellipseGeo, new THREE.MeshStandardMaterial({
                color: "#000080", roughness: 0.15, side: THREE.DoubleSide
              }));
              pendantGroup.add(ellipseMesh);

              const textMesh = new THREE.Mesh(textGeo, new THREE.MeshStandardMaterial({ color: "#ffffff", roughness: 0.3 }));
              textMesh.position.z = 0.08;
              pendantGroup.add(textMesh);
              currentPendantLength = 0.8;
            } else if (index === 1) {
              const tagBg = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.7, 0.08), pinkMaterial);
              pendantGroup.add(tagBg);
              const textMesh = new THREE.Mesh(textGeo, new THREE.MeshStandardMaterial({ color: "#ffffff", roughness: 0.2 }));
              textMesh.position.z = 0.06;
              pendantGroup.add(textMesh);
            } else {
              const connectionRing = new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.025, 16, 48), chromeMaterial);
              connectionRing.position.y = 0.25;
              pendantGroup.add(connectionRing);
              const textMesh = new THREE.Mesh(textGeo, chromeMaterial);
              pendantGroup.add(textMesh);
            }

            scene.add(pendantGroup);
            pendantGroup.userData = { linkIndex: index };
            clickablePendants.push(pendantGroup);

            const pendantPos = worldAttachPoint.clone().add(
              new THREE.Vector3(0, -(segmentsPerChain * segmentLength + currentPendantLength), 0)
            );

            points.push({ type: 'pendant', mesh: pendantGroup, position: pendantPos.clone(), oldPosition: pendantPos.clone() });
            chains.push({ localAttachPoint: localAttachPoint, points: points, segmentLength: segmentLength, pendantLength: currentPendantLength });
          });
        });

        const dom = renderer.domElement;

        dom.addEventListener('mousedown', (e) => {
          isDragging = true;
          previousMousePosition = { x: e.clientX, y: e.clientY };
          startMousePos = { x: e.clientX, y: e.clientY };
        });

        dom.addEventListener('mousemove', (e) => {
          const rect = dom.getBoundingClientRect();
          mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

          if (!isDragging) {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickablePendants, true);
            dom.style.cursor = (intersects.length > 0) ? 'pointer' : 'default';
          } else {
            dom.style.cursor = 'grabbing';
            const deltaMove = { x: e.clientX - previousMousePosition.x, y: e.clientY - previousMousePosition.y };
            const deltaRotationQuaternion = new THREE.Quaternion().setFromEuler(new THREE.Euler(
              deltaMove.y * 0.006, deltaMove.x * 0.006, 0, 'XYZ'
            ));
            ring.quaternion.multiplyQuaternions(deltaRotationQuaternion, ring.quaternion);
            previousMousePosition = { x: e.clientX, y: e.clientY };
          }
        });

        window.addEventListener('mouseup', (e) => {
          if (!isDragging) return;
          isDragging = false;
          dom.style.cursor = 'default';

          const distX = Math.abs(e.clientX - startMousePos.x);
          const distY = Math.abs(e.clientY - startMousePos.y);

          if (distX < CLICK_THRESHOLD && distY < CLICK_THRESHOLD) {
            const rect = dom.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickablePendants, true);

            if (intersects.length > 0) {
              let targetGroup = intersects[0].object;
              while (targetGroup.parent && !clickablePendants.includes(targetGroup)) {
                targetGroup = targetGroup.parent;
              }
              if (clickablePendants.includes(targetGroup)) {
                const linkIndex = targetGroup.userData.linkIndex;
                const targetUrl = targetLinks[linkIndex];
                if (targetUrl) window.location.href = targetUrl;
              }
            }
          }
        });

        dom.addEventListener('touchstart', (e) => {
          isDragging = true;
          previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
          startTouchPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });

        dom.addEventListener('touchmove', (e) => {
          if (!isDragging) return;
          const deltaMove = { x: e.touches[0].clientX - previousMousePosition.x, y: e.touches[0].clientY - previousMousePosition.y };
          const deltaRotationQuaternion = new THREE.Quaternion().setFromEuler(new THREE.Euler(
            deltaMove.y * 0.006, deltaMove.x * 0.006, 0, 'XYZ'
          ));
          ring.quaternion.multiplyQuaternions(deltaRotationQuaternion, ring.quaternion);
          previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });

        window.addEventListener('touchend', (e) => {
          if (!isDragging) return;
          isDragging = false;
          if (e.changedTouches.length > 0) {
            const distX = Math.abs(e.changedTouches[0].clientX - startTouchPos.x);
            const distY = Math.abs(e.changedTouches[0].clientY - startTouchPos.y);

            if (distX < CLICK_THRESHOLD && distY < CLICK_THRESHOLD) {
              const rect = dom.getBoundingClientRect();
              mouse.x = ((e.changedTouches[0].clientX - rect.left) / rect.width) * 2 - 1;
              mouse.y = -((e.changedTouches[0].clientX - rect.top) / rect.height) * 2 + 1;

              raycaster.setFromCamera(mouse, camera);
              const intersects = raycaster.intersectObjects(clickablePendants, true);

              if (intersects.length > 0) {
                let targetGroup = intersects[0].object;
                while (targetGroup.parent && !clickablePendants.includes(targetGroup)) {
                  targetGroup = targetGroup.parent;
                }
                if (clickablePendants.includes(targetGroup)) {
                  const linkIndex = targetGroup.userData.linkIndex;
                  const targetUrl = targetLinks[linkIndex];
                  if (targetUrl) window.location.href = targetUrl;
                }
              }
            }
          }
        });

        window.addEventListener("resize", () => {
          camera.aspect = container.clientWidth / container.clientHeight;
          camera.updateProjectionMatrix();
          camera.position.z = getResponsiveCameraZ();
          renderer.setSize(container.clientWidth, container.clientHeight);
        });

        function animate() {
          requestAnimationFrame(animate);
          if (ring) {
            ring.updateMatrixWorld();
            chains.forEach(chain => {
              const currentWorldAttachPoint = chain.localAttachPoint.clone().applyMatrix4(ring.matrixWorld);
              chain.points.forEach(p => {
                const velocity = p.position.clone().sub(p.oldPosition).multiplyScalar(DAMPING);
                p.oldPosition.copy(p.position);
                p.position.add(velocity);
                p.position.y += GRAVITY;
              });

              for (let sim = 0; sim < 3; sim++) {
                chain.points.forEach((p, i) => {
                  if (i === 0) {
                    const dir = p.position.clone().sub(currentWorldAttachPoint);
                    dir.normalize();
                    p.position.copy(currentWorldAttachPoint.clone().add(dir.multiplyScalar(chain.segmentLength)));
                  } else {
                    const prevP = chain.points[i - 1];
                    const targetLen = (p.type === 'pendant') ? chain.pendantLength : chain.segmentLength;
                    const dir = p.position.clone().sub(prevP.position);
                    dir.normalize();
                    p.position.copy(prevP.position.clone().add(dir.multiplyScalar(targetLen)));
                  }
                });
              }

              chain.points.forEach((p, i) => {
                p.mesh.position.copy(p.position);
                if (p.type === 'chain') {
                  const targetLook = (i === 0) ? currentWorldAttachPoint : chain.points[i - 1].position;
                  p.mesh.lookAt(targetLook);
                  p.mesh.rotateX(Math.PI / 2); 
                  if (p.index % 2 === 0) p.mesh.rotateY(Math.PI / 2); 
                } else if (p.type === 'pendant') {
                  p.mesh.lookAt(p.mesh.position.clone().add(new THREE.Vector3(0, 0, 1)));
                }
              });
            });
          }
          renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
