<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Drawing - MacBook on Table</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

  <div class="artboard">
    
    <div class="desk-setup">
      <div class="macbook-shadow"></div>

      <div class="macbook">
        <div class="screen-container">
          <div class="screen-assembly">
            <div class="camera"></div>
            <div class="display">
              <div class="code-lines">
                <div class="line short"></div>
                <div class="line medium"></div>
                <div class="line indent long"></div>
                <div class="line indent medium"></div>
                <div class="line long"></div>
              </div>
            </div>
            <div class="bezel-bottom">MacBook Pro</div>
          </div>
        </div>
        <div class="hinge"></div>
        <div class="body-base"></div>
      </div>

      <div class="table-container">
        <div class="table-top"></div>
        <div class="table-edge"></div>
        <div class="table-legs">
          <div class="leg"></div>
          <div class="leg"></div>
        </div>
      </div>
    </div> <footer class="footer-container">
      <a href="../index.html" class="home-link">GO BACK TO STARTING PAGE</a>
    </footer>

  </div> </body>
</html>
