<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry Clock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
            font-family: sans-serif;
        }

        #screen-container {
            width: 1080px;
            height: 1920px;
            position: relative;
            display: flex;
            flex-direction: column;
            transform-origin: center center;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        .half {
            width: 100%;
            height: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #top-area { background-color: #15f58d; }
        #bottom-area { background-color: #fff; }

        .container-circle {
            width: 660px;
            height: 660px;
            background-color: #0d0d0d;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.9);
        }

        .lcd-screen {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            height: 80px;
            background-color: #111;
            border: 3px solid #666;
            border-radius: 10px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.9), 0 4px 10px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        .lcd-text {
            font-family: 'Courier New', Courier, monospace;
            font-size: 2.3rem;
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.8);
            letter-spacing: 2px;
        }

        .dot {
            position: absolute;
            top: 50%;
            left: 50%;
            background-color: #ffffff;
            border-radius: 50%;
            will-change: transform, opacity;
            filter: blur(0.4px) drop-shadow(0 0 3px rgba(255, 255, 255, 0.9));
            opacity: 0; 
            transition: opacity 0.5s ease;
        }

        /* ------------------------------------
           [신규 추가] 하단 홈 링크 스타일
        --------------------------------------- */
        .home-link-container {
            position: absolute;
            bottom: 40px; /* 세탁기 인터페이스 최하단 배치 */
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }

        .home-link {
            color: #111111; /* 바닥 영역 흰 배경(#fff) 위에서 선명하게 보이도록 블랙 지정 */
            text-decoration: none;
            font-family: sans-serif; 
            font-size: 20px; /* 기존 모바일 스케일 1080x1920 해상도에 맞춰 크기 최적화 */
            font-weight: bold;
            letter-spacing: 1px;
            position: relative;
            display: inline-block;
            padding-bottom: 6px;
            transition: color 0.3s ease;
        }

        /* 애니메이션 밑줄 효과 */
        .home-link::after {
            content: '';
            position: absolute;
            width: 100%;
            transform: scaleX(0);
            height: 3px; /* 가시성을 위해 조금 더 선명한 두께로 세팅 */
            bottom: 0;
            left: 0;
            background-color: #15f58d; /* 시그니처 연두색 테마 컬러 */
            transform-origin: bottom left;
            transition: transform 0.3s ease-out;
        }

        /* 호버 시 인터랙션 */
        .home-link:hover {
            color: #15f58d; /* 글자색 연두색 변화 */
        }

        .home-link:hover::after {
            transform: scaleX(1); /* 왼쪽 -> 오른쪽 채워짐 효과 */
        }
    </style>
</head>
<body>

    <div id="screen-container">
        <div class="half" id="top-area">
            <div class="container-circle" id="hour-container">
                <div class="lcd-screen">
                    <div class="lcd-text" id="lcd-hour">00</div>
                </div>
            </div>
        </div>

        <div class="half" id="bottom-area">
            <div class="container-circle" id="minute-container">
                <div class="lcd-screen">
                    <div class="lcd-text" id="lcd-minute">00</div>
                </div>
            </div>
            
            <div class="home-link-container">
                <a href="../index.html" class="home-link">GO BACK TO STARTING PAGE</a>
            </div>
        </div>
    </div>

    <script>
        function resizeScreen() {
            const container = document.getElementById('screen-container');
            const scale = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
            container.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', resizeScreen);
        resizeScreen();

        const R = 660 / 2; 
        let hourDots = [];
        let minuteDots = [];
        let lastHour = -1;
        let lastMinute = -1;

        // [리드미컬 튜닝 파라미터]
        const GRAVITY = 0.32;             
        const DRUM_FRICTION = 0.35;       
        const AIR_RESISTANCE = 0.945;     
        const laundryCycleSpeed = 0.0004; 
        let laundryCyclePhase = 0;
        
        // 감속 제어를 위한 글로벌 스케일러 변수 (1일 때 정상속도, 0이면 멈춤)
        let motorSpeedScaler = 1; 

        function createDotsData(count, dotRadius) {
            let dots = [];
            for (let i = 0; i < count; i++) {
                const angle = Math.PI * 0.5 + (Math.random() * 0.4 - 0.2);
                const dist = (R - 50) * (0.1 + Math.random() * 0.2); 
                const x = Math.cos(angle) * dist;
                const y = Math.sin(angle) * dist;

                const element = document.createElement('div');
                element.className = 'dot';
                element.style.width = `${dotRadius * 2}px`;
                element.style.height = `${dotRadius * 2}px`;
                element.style.marginLeft = `-${dotRadius}px`;
                element.style.marginTop = `-${dotRadius}px`;

                dots.push({
                    x: x, y: y,
                    px: x, py: y, 
                    radius: dotRadius,
                    element: element,
                    status: "normal",
                    opacity: 0,
                    fallSpeed: 4 + Math.random() * 2
                });
            }
            return dots;
        }

        function initContainer(containerId, dotsArray) {
            const container = document.getElementById(containerId);
            dotsArray.forEach(dot => {
                container.appendChild(dot.element);
                requestAnimationFrame(() => {
                    dot.opacity = 0.95;
                    dot.element.style.opacity = dot.opacity;
                });
            });
        }

        function animate() {
            laundryCyclePhase += laundryCycleSpeed;
            
            const motorSpeed = Math.sin(laundryCyclePhase) * 0.012 * motorSpeedScaler; 

            function updateVerlet(dots, directionSign) {
                const currentMotorRotation = motorSpeed * directionSign;

                for (let i = 0; i < dots.length; i++) {
                    if (dots[i].status !== "normal") continue;
                    for (let j = i + 1; j < dots.length; j++) {
                        if (dots[j].status !== "normal") continue;

                        const dx = dots[j].x - dots[i].x;
                        const dy = dots[j].y - dots[i].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const minDist = dots[i].radius + dots[j].radius + 2; 

                        if (dist < minDist) {
                            const overlap = minDist - dist;
                            const nx = (dx / dist) * overlap * 0.45;
                            const ny = (dy / dist) * overlap * 0.45;
                            dots[i].x -= nx;
                            dots[i].y -= ny;
                            dots[j].x += nx;
                            dots[j].y += ny;
                        }
                    }
                }

                dots.forEach(dot => {
                    if (dot.status === "normal") {
                        const vx = (dot.x - dot.px) * AIR_RESISTANCE;
                        const vy = (dot.y - dot.py) * AIR_RESISTANCE;

                        dot.px = dot.x;
                        dot.py = dot.y;

                        dot.x += vx;
                        dot.y += vy + GRAVITY;

                        const distFromCenter = Math.sqrt(dot.x * dot.x + dot.y * dot.y);
                        const maxR = R - dot.radius - 4;

                        if (distFromCenter > maxR) {
                            const angle = Math.atan2(dot.y, dot.x);
                            dot.x = Math.cos(angle) * maxR;
                            dot.y = Math.sin(angle) * maxR;

                            const tangentX = -Math.sin(angle);
                            const tangentY = Math.cos(angle);
                            
                            const pushForce = maxR * currentMotorRotation * DRUM_FRICTION;
                            dot.x += tangentX * pushForce;
                            dot.y += tangentY * pushForce;
                        }
                    } else if (dot.status === "disappearing") {
                        dot.y += dot.fallSpeed;
                        dot.opacity -= 0.05;
                        if (dot.opacity < 0) dot.opacity = 0;
                        dot.element.style.opacity = dot.opacity;
                    }

                    dot.element.style.transform = `translate3d(${dot.x}px, ${dot.y}px, 0)`;
                });
            }

            updateVerlet(hourDots, 1);
            updateVerlet(minuteDots, -1);

            requestAnimationFrame(animate);
        }

        function checkTime() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            
            if (seconds >= 57) {
                motorSpeedScaler = Math.max(0, (60 - seconds) / 3);
            } else {
                motorSpeedScaler = 1;
            }

            document.getElementById('lcd-hour').innerText = String(hours).padStart(2, '0');
            document.getElementById('lcd-minute').innerText = String(minutes).padStart(2, '0');

            if (hours !== lastHour || minutes !== lastMinute) {
                
                laundryCyclePhase = 0; 
                motorSpeedScaler = 1;

                if (lastHour === -1) {
                    const hourCount = (hours === 0) ? 12 : hours;
                    hourDots = createDotsData(hourCount, 12); 
                    initContainer('hour-container', hourDots);
                } else if (hours !== lastHour) {
                    hourDots.forEach(dot => dot.status = "disappearing");
                    const oldHourDots = hourDots;
                    setTimeout(() => {
                        oldHourDots.forEach(dot => dot.element.remove());
                    }, 500);

                    const hourCount = (hours === 0) ? 12 : hours;
                    hourDots = createDotsData(hourCount, 12);
                    initContainer('hour-container', hourDots);
                }

                if (lastMinute === -1) {
                    const minuteCount = (minutes === 0) ? 60 : minutes;
                    minuteDots = createDotsData(minuteCount, 8); 
                    initContainer('minute-container', minuteDots);
                } else if (minutes !== lastMinute) {
                    minuteDots.forEach(dot => dot.status = "disappearing");
                    const oldMinuteDots = minuteDots;
                    setTimeout(() => {
                        oldMinuteDots.forEach(dot => dot.element.remove());
                    }, 500);

                    const minuteCount = (minutes === 0) ? 60 : minutes;
                    minuteDots = createDotsData(minuteCount, 8);
                    initContainer('minute-container', minuteDots);
                }

                lastHour = hours;
                lastMinute = minutes;
            }
        }

        checkTime();
        animate();
        setInterval(checkTime, 200); 
    </script>
</body>
</html>
